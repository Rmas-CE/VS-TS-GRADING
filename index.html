<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TS POSM KPI Grading</title>
<style>
:root{
  --bg:#06141b; --bg2:#0a1f29; --card:#0e2733; --card2:#123241; --line:#1d4556;
  --text:#e6f4f7; --muted:#8fb3bf; --accent:#19d3c5; --accent2:#3fa9f5;
  --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,#0f3a48 0%,transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(6,20,27,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#04202a;box-shadow:0 0 18px rgba(25,211,197,.45);font-size:12px}
.brand h1{font-size:16px;margin:0;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,211,197,.15)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
input[type=date]{color-scheme:dark}
.controls input[type=date]{width:150px}
nav{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:none;padding:10px 13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:600}
nav button.active{color:var(--accent);border-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.enc{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
@media(max-width:900px){.two,.enc,.three{grid-template-columns:minmax(0,1fr)}}
.mt{margin-top:14px}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700}
.stat .v{font-size:28px;font-weight:800}
.stat .s{color:var(--muted);font-size:12px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04202a;border:none}
.btn.danger{color:#fca5a5;border-color:#5b2626}
.btn.ok{color:#86efac;border-color:#1f5b36}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(25,211,197,.04)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#04202a;white-space:nowrap}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ack{color:#86efac;border-color:#1f5b36}.tag.dis{color:#fca5a5;border-color:#7f1d1d}.tag.pen{color:#fcd34d;border-color:#6b4f12}
.muted{color:var(--muted)}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.kpibar{display:grid;grid-template-columns:minmax(110px,1.3fr) 3fr 64px;gap:10px;align-items:center;margin:8px 0}
.kpibar .n small{color:var(--muted)}
.kpibar .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.funnel .step{display:grid;grid-template-columns:140px 1fr 64px;gap:10px;align-items:center;margin:7px 0}
.funnel .fb{height:26px;border-radius:6px;background:linear-gradient(90deg,#19d3c5,#3fa9f5);display:flex;align-items:center;padding-left:8px;font-weight:700;color:#04202a;font-size:12px;min-width:2px}
@media(max-width:560px){.funnel .step{grid-template-columns:96px 1fr 56px}.kpibar{grid-template-columns:1fr 64px}.kpibar .bar{grid-column:1/-1;order:3}}
.sect{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--bg2)}
.sect .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.sect .hd b{font-size:14px}
.sect .hd span{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}
.sect p{margin:0 0 10px;color:var(--muted);font-size:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fields label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fields input{width:100%}
.butbl input{width:100%;min-width:64px;padding:6px 8px;text-align:right}
.butbl td,.butbl th{padding:5px 4px;border:none}
input.auto{border-color:#3fa9f5;background:#0b2a3c}
.res{margin-top:10px;font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.res b{color:var(--text)}
.err{color:#fca5a5;font-size:12px;margin-top:6px}
.calc{font-variant-numeric:tabular-nums}
.calc .ln{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:8px}
.calc .ln span:first-child{color:var(--muted)}
.final{text-align:center;padding:14px 0 6px}
.final .v{font-size:44px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.flag{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#fcd34d;padding:7px 10px;border-radius:8px;font-size:12px;margin-top:6px}
.flag.red{color:#fca5a5;border-color:#7f1d1d;background:rgba(239,68,68,.1)}
.flag.green{color:#86efac;border-color:#1f5b36;background:rgba(34,197,94,.08)}
.flag.blue{color:#bae6fd;border-color:#1e4f6e;background:rgba(63,169,245,.08)}
.sticky{position:sticky;top:120px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw}
.toast.show{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
svg text{fill:var(--muted);font-size:13px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.pod{border-radius:12px;padding:12px 10px;text-align:center;border:1px solid var(--line);background:var(--bg2)}
.pod .rk{font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:99px;display:inline-block;color:#1a1a1a}
.pod .nm{font-weight:700;margin-top:8px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-size:22px;font-weight:800;margin-top:2px}
.pod.p1{padding-top:26px;border-color:#b8962e;box-shadow:0 0 20px rgba(234,179,8,.15)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(380px,100%)}
.sync{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.on{color:#86efac;border-color:#1f5b36}.sync.err{color:#fca5a5;border-color:#7f1d1d}
.insight{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.insight i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#04202a}
code{background:var(--bg2);padding:1px 5px;border-radius:4px;font-size:12px}
ol.steps{padding-left:18px;margin:6px 0;font-size:12.5px;color:var(--muted)}
ol.steps li{margin:4px 0}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{background:#fff;border:1px solid #ccc;color:#000;break-inside:avoid}
  .muted,th,.card h3{color:#444}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <div class="logo">KPI</div>
      <div><h1>TS POSM KPI Grading</h1><small>RMAS VISTA · KPI Scorecard</small></div>
    </div>
    <div class="controls">
      <label for="gStart">From</label>
      <input type="date" id="gStart">
      <label for="gEnd">To</label>
      <input type="date" id="gEnd">
      <select id="gSaved" title="Jump to a date range that already has grades"></select>
      <label for="gRegion">Region</label>
      <select id="gRegion"></select>
      <span class="sync" id="syncStat">Offline</span>
      <button class="btn sm" id="roleBtn"></button>
    </div>
  </div>
  <nav id="nav">
    <button data-v="dash" class="active">Dashboard</button>
    <button data-v="enc" data-admin="1">Encode Grades</button>
    <button data-v="card">TS Scorecard</button>
    <button data-v="roll">Quarterly / Yearly</button>
    <button data-v="imp" data-admin="1">Import &amp; Sync</button>
    <button data-v="set" data-admin="1">Settings</button>
  </nav>
</header>

<main>
  <section id="v-dash"></section>
  <section id="v-enc" class="hidden"></section>
  <section id="v-card" class="hidden"></section>
  <section id="v-roll" class="hidden"></section>
  <section id="v-imp" class="hidden"></section>
  <section id="v-set" class="hidden"></section>
</main>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<script>
/* =====================================================================
   ONLINE CONFIG — fill these in ONCE before uploading to GitHub Pages.
   With KPI_SHEET_URL set, every device that opens the page syncs
   automatically (no need to paste the URL on each phone/laptop).
   ===================================================================== */
const CONFIG={
  KPI_SHEET_URL:'https://script.google.com/macros/s/AKfycbygdnoRRsnSS20w047MS2lNOjY9pqxCNb-ehatEEdriwgUdzlw_vXz5vDixwDCqupTc/exec',     // Web App URL of THIS tool's Google Sheet (Code.gs) — ends in /exec
  INVENTORY_URL:'https://script.google.com/macros/s/AKfycbxJ7UqqR7WKe9iBu1y9QUm4UdFsZT-oNLnRdwNsG1M2i3DrjvW0YnXY1QHb4H22SQse/exec',     // RMAS Inventory Tool
  DEPLOYMENT_URL:'https://script.google.com/macros/s/AKfycbyqiLr5I2Cy0dQRdNxZenefc06ITJ4tduwpc6QB2mRglUbUMJvqElesO58W6kA9b3dXCQ/exec'     // POSM KPI Command Center / Deployment KPI Tool
};
/* =====================================================================
   CONFIG
   ===================================================================== */
const STORE_KEY='rmas_ts_posm_kpi_v4', OLD_KEY='rmas_ts_posm_kpi_v3', ROLE_KEY='rmas_kpi_role', URL_KEY='rmas_kpi_sheet_url';
const BUS=['AV','HA','AC'];
const BU_FIELDS=[['required','Target deployments'],['complete','Complete'],['fullDep','Incomplete – Full Dep. (no stock)'],['delivered','Request POSM delivered (qty)']];
const BU_SHORT={required:'Target',complete:'Complete',fullDep:'Inc. Full Dep.',delivered:'Request delivered qty'};
const DEFAULT_WEIGHTS={dep:40,rep:40,com:20};
const DEFAULT_GRADES=[
  {min:95,label:'Outstanding',color:'#19d3c5'},{min:90,label:'Excellent',color:'#3fa9f5'},
  {min:85,label:'Very Good',color:'#7dd3fc'},{min:80,label:'Good',color:'#a3e635'},
  {min:75,label:'Needs Improvement',color:'#f59e0b'},{min:0,label:'Poor',color:'#ef4444'}];
const DEFAULT_DEDUCTIONS=[
  {id:'d1',label:'Fake / recycled photo proof',pts:5},
  {id:'d2',label:'Unreported damaged / outdated POSM found in audit',pts:3},
  {id:'d3',label:'POSM deployed not per allocation (wrong store/model)',pts:3},
  {id:'d4',label:'No-show on RMAS-scheduled store visit without notice',pts:2}];
const FLAT={
  req:[['reqDeployed','Delivered request POSM actually deployed (qty) — only if partially deployed']],
  audit:[['auditStores','Stores audited (random audit)'],['auditVerified','Stores with verified actual display']],
  rep:[['repDue','Reports due in the period'],['repOnTime','Submitted on time'],['repAccurate','Accurate (no corrections needed)'],['reported','Deployments reported with photo proof']],
  com:[['comSent','RMAS instructions / concerns sent'],['comResp','Acknowledged / responded within SLA'],['meetReq','Meetings / huddles required'],['meetAtt','Meetings / huddles attended']]
};
const FLAT_KEYS=Object.values(FLAT).flat().map(f=>f[0]);
const BU_PATHS=BUS.flatMap(b=>BU_FIELDS.map(([f])=>`bu.${b}.${f}`));
const ALL_PATHS=[...BU_PATHS,...FLAT_KEYS];
const FIELD_LABEL=Object.fromEntries([...BU_FIELDS,...Object.values(FLAT).flat()]);

/* =====================================================================
   UTILS
   ===================================================================== */
const n=v=>{const x=parseFloat(v);return isFinite(x)&&x>=0?x:0};
const has=v=>v!==undefined&&v!==null&&v!=='';
const clamp=x=>Math.max(0,Math.min(1,x));
const avg=a=>a.length?a.reduce((p,q)=>p+q,0)/a.length:null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(x,d=1)=>x==null?'—':(x*100).toFixed(d)+'%';
const fx=(x,d=2)=>x==null?'—':x.toFixed(d)+'%';
function getP(o,p){return p.split('.').reduce((x,k)=>x==null?undefined:x[k],o)}
function setP(o,p,v){const ks=p.split('.');let x=o;ks.slice(0,-1).forEach(k=>{if(!x[k]||typeof x[k]!=='object')x[k]={};x=x[k]});x[ks[ks.length-1]]=v}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
/* ---- Date range periods ----
   A grading period is a date range stored as "YYYY-MM-DD~YYYY-MM-DD" (start~end).
   Old month keys "YYYY-MM" are converted to the full month range on load. */
const pad2=x=>String(x).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayYmd=()=>ymd(new Date());
const pDate=v=>{const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)};
function lastDay(ym){const [y,m]=ym.split('-').map(Number);return ymd(new Date(y,m,0))}
function monthToPeriod(ym){return ym+'-01~'+lastDay(ym)}
function pStart(p){return String(p).split('~')[0]}
function pEnd(p){const x=String(p).split('~');return x[1]||x[0]}
function isFullMonth(p){const s=pStart(p),e=pEnd(p);return s.slice(8)==='01'&&s.slice(0,7)===e.slice(0,7)&&e===lastDay(s.slice(0,7))}
function periodHasToday(p){const t=todayYmd();return pStart(p)<=t&&t<=pEnd(p)}
function inPeriod(d,p){return !!d&&pStart(p)<=d&&d<=pEnd(p)}
// Long label: "September 2026" (whole month) · "Sep 5, 2026" · "Sep 5 – Oct 4, 2026" · "Dec 15, 2025 – Jan 14, 2026"
function monthLabel(p){p=String(p||'');if(/^\d{4}-\d{2}$/.test(p))p=monthToPeriod(p);if(!p.includes('-'))return p;
  const s=pDate(pStart(p)),e=pDate(pEnd(p));
  if(isFullMonth(p))return s.toLocaleString('en',{month:'long',year:'numeric'});
  const md=d=>d.toLocaleString('en',{month:'short',day:'numeric'}),full=d=>d.toLocaleString('en',{month:'short',day:'numeric',year:'numeric'});
  if(pStart(p)===pEnd(p))return full(s);
  return s.getFullYear()===e.getFullYear()?md(s)+' – '+full(e):full(s)+' – '+full(e)}
// Short label for chart axes / table headers
function monthShort(p){p=String(p||'');if(/^\d{4}-\d{2}$/.test(p))p=monthToPeriod(p);const s=pDate(pStart(p)),e=pDate(pEnd(p));
  if(isFullMonth(p))return s.toLocaleString('en',{month:'short'})+' '+String(s.getFullYear()).slice(2);
  const md=d=>(d.getMonth()+1)+'/'+d.getDate();return pStart(p)===pEnd(p)?md(s):md(s)+'–'+md(e)}
// Any date value → "YYYY-MM-DD" in local time ('' if unreadable)
function dateOf(v){if(v===undefined||v===null||v==='')return '';if(v instanceof Date)return isNaN(v)?'':ymd(v);const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)||/^\d{4}-\d{2}-\d{2}[ T]\d{1,2}:\d{2}(:\d{2})?$/.test(s))return s.slice(0,10);
  const d=new Date(s);return isNaN(d)?'':ymd(d)}
function periodKeys(){return [...new Set(Object.keys(S.records).map(k=>k.split('|')[0]))].sort()}
function prevPeriod(p){return periodKeys().filter(x=>x<p).pop()||null}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(lines){return lines.map(l=>l.map(csvCell).join(',')).join('\n')}
function parseCsv(text){text=text.replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}
  else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
function copyFallback(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).catch(()=>copyFallback(t));copyFallback(t);return Promise.resolve()}
function uid(p='ts'){return p+Math.random().toString(36).slice(2,9)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* =====================================================================
   KPI DEFINITIONS
   ===================================================================== */
// deployed = "done" = Complete + Incomplete-Full-Deployment (no stock available → counted as complete)
function agg(r){const o={required:0,complete:0,fullDep:0,delivered:0,anyBU:false};
  BUS.forEach(b=>{const x=(r.bu||{})[b]||{};BU_FIELDS.forEach(([f])=>{if(has(x[f])){o[f]+=n(x[f]);o.anyBU=true}})});
  o.deployed=o.complete+o.fullDep;o.incomplete=Math.max(0,o.required-o.deployed);return o}
const buDone=x=>n(x.complete)+n(x.fullDep);
// Request deployment (Inventory Tool requests + RMAS verification):
//  verified  → 100% (all delivered request POSM deployed, or no request in the period)
//  partial   → deployed qty ÷ delivered qty
//  not yet verified → not counted (pending)
function reqScore(r,a){a=a||agg(r);if(r.reqVerify==='verified')return 1;if(r.reqVerify==='partial')return a.delivered>0?clamp(n(r.reqDeployed)/a.delivered):null;return null}
function verRate(r){return n(r.auditStores)>0?clamp(n(r.auditVerified)/n(r.auditStores)):1}
function buRate(r,b){const x=(r.bu||{})[b]||{};return n(x.required)>0?clamp(Math.min(buDone(x),n(x.required))/n(x.required)):null}

const KPIS=[
 {key:'dep',name:'POSM Deployment Execution',short:'Deployment',
  desc:'Deployment status per BU from the Deployment KPI Tool (Incomplete – Full Deployment = no available stock, counted as complete), plus deployment of the POSM the TS requested and received from the Inventory Tool, verified by RMAS. No request within the date range = 100% once RMAS verifies.',
  formula:'Average of: ((Complete + Incomplete Full Dep.) × Audit verification rate) ÷ Target, and Request deployment (RMAS-verified: 100%, or deployed qty ÷ delivered qty)',
  calc:(r,a)=>{const p=[];if(a.required>0)p.push(clamp(Math.min(a.deployed,a.required)*verRate(r)/a.required));const q=reqScore(r,a);if(q!=null)p.push(q);return avg(p)},
  check:(r,a)=>{const e=[];BUS.forEach(b=>{const x=(r.bu||{})[b]||{};if(buDone(x)>n(x.required)&&has(x.required))e.push(`${b}: Complete + Incomplete Full Dep. cannot exceed Target.`)});
    if(n(r.auditVerified)>n(r.auditStores))e.push('Verified stores cannot exceed stores audited.');if(r.reqVerify==='partial'&&n(r.reqDeployed)>a.delivered)e.push('Deployed request POSM cannot exceed delivered qty.');return e}},
 {key:'rep',name:'POSM Reporting Accuracy & Timeliness',short:'Reporting',
  desc:'Correct and on-time submission of POSM reports, plus deployments reported with photo proof.',
  formula:'Average of: On-time ÷ Due, Accurate ÷ Due, Reported with proof ÷ Deployed',
  calc:(r,a)=>{const p=[];const d=n(r.repDue);if(d>0){p.push(clamp(n(r.repOnTime)/d));p.push(clamp(n(r.repAccurate)/d))}
    if(a.deployed>0&&has(r.reported))p.push(clamp(n(r.reported)/a.deployed));return avg(p)},
  check:(r,a)=>{const e=[];if(n(r.repOnTime)>n(r.repDue))e.push('On-time reports cannot exceed reports due.');
    if(n(r.repAccurate)>n(r.repDue))e.push('Accurate reports cannot exceed reports due.');
    if(n(r.reported)>a.deployed)e.push('Reported deployments cannot exceed Complete + Incomplete Full Dep.');return e}},
 {key:'com',name:'Communication',short:'Communication',
  desc:'Responsiveness to RMAS instructions/concerns, timely escalation of POSM issues, and attendance to meetings/huddles.',
  formula:'Average of: Responded within SLA ÷ Instructions sent, Attended ÷ Meetings required',
  calc:(r)=>{const p=[];if(n(r.comSent)>0)p.push(clamp(n(r.comResp)/n(r.comSent)));if(n(r.meetReq)>0)p.push(clamp(n(r.meetAtt)/n(r.meetReq)));return avg(p)},
  check:(r)=>{const e=[];if(n(r.comResp)>n(r.comSent))e.push('Responded cannot exceed instructions sent.');
    if(n(r.meetAtt)>n(r.meetReq))e.push('Attended cannot exceed meetings required.');return e}}
];

  dep:'Close the remaining Incomplete deployments: schedule store visits per BU, confirm install dates with store managers, and make sure every deployed POSM is actually displayed (audit verification affects the score).',

let S, role=lsGet(ROLE_KEY)==='admin'?'admin':'viewer', sheetUrl=CONFIG.KPI_SHEET_URL||lsGet(URL_KEY)||'';
function load(){try{const x=lsGet(STORE_KEY);if(x){const o=JSON.parse(x);if(o&&o.ts&&o.records)return o}}catch(e){}return null}
function normalizeState(o){o.weights=o.weights||{...DEFAULT_WEIGHTS};o.grades=o.grades||DEFAULT_GRADES.map(g=>({...g}));
  o.deductions=o.deductions||DEFAULT_DEDUCTIONS.map(d=>({...d}));o.adminPass=o.adminPass||'admin123';o.sources=Object.assign({inventoryUrl:'',autoPull:true,lastPull:null,deploymentUrl:'',depAutoPull:true,depLastPull:null},o.sources||{});if(CONFIG.INVENTORY_URL)o.sources.inventoryUrl=CONFIG.INVENTORY_URL;if(CONFIG.DEPLOYMENT_URL)o.sources.deploymentUrl=CONFIG.DEPLOYMENT_URL;o.buMap=o.buMap||{};o.deleted=o.deleted||{};o.deletedTs=o.deletedTs||{};
  // Convert old per-month keys ("2026-09|id") into date-range keys ("2026-09-01~2026-09-30|id")
  const now=new Date().toISOString();
  Object.keys(o.records).forEach(k=>{const i=k.indexOf('|'),m=k.slice(0,i),id=k.slice(i+1);if(!/^\d{4}-\d{2}$/.test(m))return;
    const nk=monthToPeriod(m)+'|'+id,r=o.records[k];if(!o.records[nk]||String(r.updated||'')>String(o.records[nk].updated||''))o.records[nk]=r;
    delete o.records[k];if(String(o.deleted[k]||'')<now)o.deleted[k]=now});
  return o}
/* ---- change stamping: every edit gets a timestamp so multi-device merges keep the newest version ---- */
const SETTING_KEYS=['weights','grades','deductions','adminPass','sources','buMap'];
const noUpd=o=>{const c=Object.assign({},o);delete c.updated;return JSON.stringify(c)};
let lastSnap=null;
function snap(){return {settings:JSON.stringify(SETTING_KEYS.map(k=>S[k])),ts:Object.fromEntries(S.ts.map(t=>[t.id,noUpd(t)])),rec:Object.fromEntries(Object.entries(S.records).map(([k,r])=>[k,noUpd(r)]))}}
function stamp(){const now=new Date().toISOString();if(!lastSnap){lastSnap=snap();return}
  if(lastSnap.settings!==JSON.stringify(SETTING_KEYS.map(k=>S[k])))S.settingsUpdated=now;
  S.ts.forEach(t=>{if(lastSnap.ts[t.id]!==noUpd(t))t.updated=now});Object.keys(lastSnap.ts).forEach(id=>{if(!S.ts.some(t=>t.id===id))S.deletedTs[id]=now});
  Object.entries(S.records).forEach(([k,r])=>{if(lastSnap.rec[k]!==noUpd(r))r.updated=now});Object.keys(lastSnap.rec).forEach(k=>{if(!S.records[k])S.deleted[k]=now});
  lastSnap=snap()}
function save(push=true){stamp();lsSet(STORE_KEY,JSON.stringify(S));if(push)schedulePush()}
/* Same merge runs in the browser and in Code.gs: newest record / TS / settings win; deletions are remembered. */
function mergeState(a,b){
  if(!a||!a.records)return b;if(!b||!b.records)return a;
  const str=v=>String(v||'');const o={};
  const base=str(a.settingsUpdated)>=str(b.settingsUpdated)?a:b;
  ['weights','grades','deductions','adminPass','sources','buMap','settingsUpdated'].forEach(function(k){o[k]=base[k]});
  const tomb=function(x,y){const t=Object.assign({},x||{});Object.keys(y||{}).forEach(function(k){if(!t[k]||str(y[k])>str(t[k]))t[k]=y[k]});return t};
  o.deleted=tomb(a.deleted,b.deleted);o.deletedTs=tomb(a.deletedTs,b.deletedTs);
  o.records={};Object.keys(Object.assign({},a.records,b.records)).forEach(function(k){const x=a.records[k],y=b.records[k];
    const r=!x?y:!y?x:(str(x.updated)>=str(y.updated)?x:y);if(o.deleted[k]&&str(o.deleted[k])>=str(r.updated))return;o.records[k]=r});
  const m={};(a.ts||[]).concat(b.ts||[]).forEach(function(t){const c=m[t.id];if(!c||str(t.updated)>str(c.updated))m[t.id]=t});
  o.ts=Object.keys(m).map(function(id){return m[id]}).filter(function(t){return !(o.deletedTs[t.id]&&str(o.deletedTs[t.id])>=str(t.updated))});
  return o}

function emptyData(){return normalizeState({ts:[],records:{}})}
// First run of v4: keep settings (weights, grades, deductions, password, connected tools) from the old version, drop the sample TS & grades.
function migrate(){try{const x=lsGet(OLD_KEY);if(!x)return null;const o=JSON.parse(x);return normalizeState({ts:[],records:{},weights:o.weights,grades:o.grades,deductions:o.deductions,adminPass:o.adminPass,sources:o.sources})}catch(e){return null}}
S=load()||migrate()||emptyData();normalizeState(S);lastSnap=snap();lsSet(STORE_KEY,JSON.stringify(S));

/* =====================================================================
   COMPUTE
   ===================================================================== */
function gradeOf(score){if(score==null)return null;const g=[...S.grades].sort((a,b)=>b.min-a.min);return g.find(x=>score>=x.min)||g[g.length-1]}
function compute(r){
  const a=agg(r),scores={},lines=[];let wsum=0,tot=0;
  KPIS.forEach(k=>{const s=k.calc(r,a);scores[k.key]=s;const w=S.weights[k.key]||0;if(s!=null){wsum+=w;tot+=s*w}lines.push({k,s,w,contrib:s!=null?s*w:null})});
  const weighted=wsum>0?tot/wsum*100:null;
  const ded=(r.deductions||[]).reduce((x,d)=>x+n(d.pts),0);
  const final=weighted==null?null:Math.max(0,weighted-ded);
  const errors=KPIS.flatMap(k=>k.check(r,a));
  const flags=[];
  if(a.required>0&&a.incomplete>0)flags.push(['',`${a.incomplete} of ${a.required} deployment(s) still Incomplete — not credited.`]);
  if(a.fullDep>0)flags.push(['blue',`${a.fullDep} deployment(s) marked Incomplete – Full Deployment (no available POSM stock) — counted as complete.`]);
  if(!r.reqVerify)flags.push(['blue',a.delivered>0?`Request deployment pending RMAS verification (${a.delivered} request POSM delivered in this period).`:'No request in this period — becomes 100% once RMAS verifies deployment is complete.']);
  if(r.reqVerify==='partial'&&a.delivered>n(r.reqDeployed))flags.push(['',`${a.delivered-n(r.reqDeployed)} of ${a.delivered} delivered request POSM not deployed.`]);
  if(n(r.auditStores)>0&&n(r.auditVerified)<n(r.auditStores))flags.push(['red',`Audit: only ${n(r.auditVerified)} of ${n(r.auditStores)} audited stores had actual display — deployment credit reduced to ${pct(verRate(r))}.`]);
  if(has(r.reported)&&a.deployed>n(r.reported))flags.push(['',`${a.deployed-n(r.reported)} deployments not reported with photo proof.`]);
  if(n(r.comSent)>n(r.comResp))flags.push(['',`${n(r.comSent)-n(r.comResp)} RMAS instructions/concerns not responded within SLA.`]);
  if(ded>0)flags.push(['red',`Deductions applied: −${ded} pts (${(r.deductions||[]).map(d=>esc(d.label)).join('; ')}).`]);
  const missing=lines.filter(l=>l.s==null).map(l=>l.k.short);
  if(missing.length&&weighted!=null)flags.push(['blue',`No data for: ${missing.join(', ')} — weights redistributed across the other KPIs.`]);
  return {a,scores,lines,weighted,ded,final,grade:gradeOf(final),errors,flags,wsum};
}
const chip=g=>g?`<span class="chip" style="background:${g.color}">${g.label}</span>`:'<span class="muted">Not graded</span>';
function ackTag(r){if(!r||compute(r).final==null)return '';const s=r.ack?.status;
  return s==='acknowledged'?'<span class="tag ack">Acknowledged</span>':s==='disputed'?'<span class="tag dis">Disputed</span>':'<span class="tag pen">Pending ack</span>'}
function recOf(m,id){return S.records[m+'|'+id]}
function history(id,upto){return Object.keys(S.records).filter(k=>k.endsWith('|'+id)).map(k=>k.split('|')[0]).filter(m=>!upto||m<=upto).sort()
  .map(m=>({m,r:S.records[m+'|'+id],c:compute(S.records[m+'|'+id])})).filter(h=>h.c.final!=null)}
function watch(id,m){const h=history(id,m);const out=[];if(!h.length||h[h.length-1].m!==m)return out;const L=h.length;
  // Only judge complete grades: a TS still missing Reporting/Communication (not yet encoded) is not put on the watchlist
  if(h[L-1].c.lines.some(l=>l.s==null)){if(h[L-1].r.ack?.status==='disputed')out.push('Grade disputed by TS');return out}
  if(L>=3&&h[L-3].c.final>h[L-2].c.final&&h[L-2].c.final>h[L-1].c.final)out.push(`Declining 3 periods (${h[L-3].c.final.toFixed(1)} → ${h[L-2].c.final.toFixed(1)} → ${h[L-1].c.final.toFixed(1)})`);
  if(L>=2&&h[L-1].c.final<80&&h[L-2].c.final<80)out.push('Below 80% for 2 consecutive periods');
  else if(h[L-1].c.final<75)out.push('Poor rating this period');
  if(h[L-1].r.ack?.status==='disputed')out.push('Grade disputed by TS');
  return out}
function monthRank(m){return filteredTs().map(t=>({t,r:recOf(m,t.id)})).filter(x=>x.r).map(x=>({...x,c:compute(x.r)})).filter(x=>x.c.final!=null).sort((a,b)=>b.c.final-a.c.final)}

function nameKey(v){return String(v||'').toLowerCase().replace(/[.,;:'"()\-_/]+/g,' ').split(/\s+/).filter(Boolean).sort().join(' ')}
function findTs(name){const k=nameKey(name);if(!k)return null;return S.ts.find(t=>nameKey(t.name)===k||(t.aliases||[]).some(a=>nameKey(a)===k))||null}

function sig(r){return JSON.stringify([r.reqVerify||'',ALL_PATHS.map(p=>getP(r,p)??''),(r.deductions||[]).map(d=>d.label+d.pts).sort()])}

function insights(cur,prev,rank,total){
  const out=[];const c=cur.c,r=cur.r;
  const ls=c.lines.filter(l=>l.s!=null).sort((a,b)=>b.s-a.s);
  if(ls.length){out.push(['g','+',`Strongest area: <b>${ls[0].k.name}</b> at ${pct(ls[0].s)}.`]);
    const w=ls[ls.length-1];if(ls.length>1&&w.s<0.95)out.push(['w','!',`Focus area: <b>${w.k.name}</b> at ${pct(w.s)}. ${TIPS[w.k.key]}`])}
  const bus=BUS.map(b=>({b,r:buRate(r,b),x:(r.bu||{})[b]||{}})).filter(x=>x.r!=null).sort((a,b)=>a.r-b.r);
  if(bus.length>1&&bus[0].r<bus[bus.length-1].r-0.05)out.push(['w','!',`${bus[0].b} deployment is the lowest at ${pct(bus[0].r)} (${buDone(bus[0].x)} of ${n(bus[0].x.required)} done) vs ${bus[bus.length-1].b} at ${pct(bus[bus.length-1].r)}. Prioritize ${bus[0].b} store visits.`]);
  if(n(r.auditStores)>0&&verRate(r)<1)out.push(['b','A',`Audit found ${n(r.auditStores)-n(r.auditVerified)} of ${n(r.auditStores)} store(s) without actual display, which reduced the deployment credit to ${pct(verRate(r))} of what was reported.`]);
  if(c.ded)out.push(['w','−',`Deductions of ${c.ded} pts applied. Without them the score would be ${fx(c.weighted)} (${gradeOf(c.weighted).label}).`]);
  if(prev){const d=c.final-prev.c.final;out.push([d>=0?'g':'w',d>=0?'▲':'▼',`${d>=0?'Improved':'Dropped'} ${Math.abs(d).toFixed(2)} pts vs ${monthLabel(prev.m)}.`])}
  if(rank)out.push(['b','#',`Ranked <b>${rank}</b> of ${total} graded TS this period${$('gRegion').value?' in '+esc($('gRegion').value):''}.`]);
  const nextG=[...S.grades].sort((a,b)=>a.min-b.min).find(g=>g.min>c.final);if(nextG)out.push(['b','↑',`Needs +${(nextG.min-c.final).toFixed(2)} pts to reach <b>${nextG.label}</b>.`]);
  return out;
}
function renderCard(){
  const m=month();
  $('v-card').innerHTML=`<div class="card noprint" style="margin-bottom:14px"><div class="row">
    <label class="muted" for="cTs">Trade Supervisor</label><select id="cTs" style="min-width:230px">${tsOptions()}</select>
    <div class="row" style="margin-left:auto"><button class="btn sm" id="cCopy">Copy summary (Viber / Messenger)</button><button class="btn sm" onclick="window.print()">Print / Save PDF</button></div></div></div><div id="cBody"></div>`;
  $('cTs').onchange=e=>{selTs=e.target.value;renderCard()};
  const t=S.ts.find(x=>x.id===selTs);if(!t){$('cBody').innerHTML='<div class="card empty">No Trade Supervisor selected.</div>';return}
  const hist=history(t.id);
  const cur=hist.find(h=>h.m===m)||[...hist].reverse().find(h=>h.m<=m);
  if(!cur){$('cBody').innerHTML=`<div class="card empty">${esc(t.name)} has no grades up to ${monthLabel(m)}. ${isAdmin()?`<button class="btn sm" onclick="openTs('${t.id}','enc')">Grade now</button>`:''}</div>`;$('cCopy').disabled=true;return}
  const idx=hist.indexOf(cur),prev=idx>0?hist[idx-1]:null;

const COLS={
  month:['DATE','MONTH','PERIOD','MONTHYEAR','DATEDELIVERED','DELIVERYDATE','DATEDEPLOYED','DEPLOYMENTDATE','TRANSACTIONDATE'],ts:['TRADESUPERVISOR','TS','TSNAME','SUPERVISOR'],bu:['BU','BUSINESSUNIT'],region:['REGION'],

  fullDep:['INCOMPLETEFULLDEPLOYMENT','INCOMPLETEFULLDEP','FULLDEPLOYMENT','NOSTOCK','INCFULLDEP'],delivered:['DELIVERED','DELIVEREDQTY','POSMDELIVERED'],
auditStores:['AUDITEDSTORES','STORESAUDITED','AUDITED'],auditVerified:['AUDITVERIFIED','VERIFIEDSTORES','STORESVERIFIED','VERIFIED'],
  repDue:['REPORTSDUE'],repOnTime:['REPORTSONTIME'],repAccurate:['REPORTSACCURATE'],reported:['REPORTEDWITHPROOF','REPORTEDWITHPHOTO','WITHPHOTOPROOF','REPORTED'],
  comSent:['INSTRUCTIONSSENT','CONCERNSSENT'],comResp:['RESPONDEDWITHINSLA','RESPONDED'],meetReq:['MEETINGSREQUIRED','HUDDLESREQUIRED'],meetAtt:['MEETINGSATTENDED','HUDDLESATTENDED']};
const COL_LABEL={month:'DATE',ts:'TRADE SUPERVISOR',bu:'BU',region:'REGION',status:'STATUS',required:'TARGET',complete:'COMPLETE',fullDep:'INCOMPLETE FULL DEPLOYMENT',delivered:'DELIVERED',auditStores:'AUDITED STORES',auditVerified:'AUDIT VERIFIED',
  repDue:'REPORTS DUE',repOnTime:'REPORTS ON TIME',repAccurate:'REPORTS ACCURATE',reported:'REPORTED WITH PROOF',comSent:'INSTRUCTIONS SENT',comResp:'RESPONDED WITHIN SLA',meetReq:'MEETINGS REQUIRED',meetAtt:'MEETINGS ATTENDED'};
const BU_KEYS=BU_FIELDS.map(f=>f[0]);
function statusKind(v){const h=normH(v);if(!h)return null;if(h.includes('FULL'))return 'fullDep';if(h.startsWith('INCOMPLETE')||h.startsWith('NOT')||h.startsWith('PENDING'))return 'incomplete';if(h.startsWith('COMPLETE')||h==='DONE'||h==='DEPLOYED')return 'complete';return 'incomplete'}
const yes=v=>/^(y|yes|1|true|on ?time|ontime|✓|✔)$/i.test(String(v||'').trim());
function normH(h){return String(h).toUpperCase().replace(/[^A-Z0-9]/g,'')}
// Is a CSV date value inside the date range? true / false / null (unreadable).
// Full dates are checked day by day; a month-only value ("2026-09", "Sep 2026") counts when that month overlaps the range.
function rowInRange(v,p){v=String(v||'').trim();if(!v)return null;let x;
  if((x=v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)))return inPeriod(x[1]+'-'+pad2(x[2])+'-'+pad2(x[3]),p);
  if((x=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return inPeriod(x[3]+'-'+pad2(x[1])+'-'+pad2(x[2]),p);
  let ym=null;if((x=v.match(/^(\d{4})[-\/](\d{1,2})$/)))ym=x[1]+'-'+pad2(x[2]);else if((x=v.match(/^(\d{1,2})\/(\d{4})$/)))ym=x[2]+'-'+pad2(x[1]);
  else if(/^[A-Za-z]+\.?\s+\d{4}$/.test(v)){const d=new Date('1 '+v);if(!isNaN(d))ym=d.getFullYear()+'-'+pad2(d.getMonth()+1)}
  if(ym)return ym+'-01'<=pEnd(p)&&lastDay(ym)>=pStart(p);
  const d=dateOf(v);return d?inPeriod(d,p):null}
// BU mapping: admin-defined map first (Import & Sync → Data check), then common Samsung CE names.
function normBU(v){const raw=String(v||'').toUpperCase().trim();if(!raw)return null;if(BUS.includes(raw))return raw;
  const mp=(S.buMap||{})[raw];if(mp)return mp==='IGNORE'?null:mp;
  if(/\b(AC|RAC|SAC|CAC|AIRCON|AIRCONDITIONER|AIR CON|AIR CONDITIONER|WINDFREE|WIND-FREE)\b|AIRCON|AIR COND|WINDFREE/.test(raw))return 'AC';
  if(/\b(AV|VD|TV|LFD|SIGNAGE)\b|AUDIO|VISUAL|TELEVISION|SOUND|MONITOR|PROJECTOR|QLED|OLED|THE FRAME/.test(raw))return 'AV';
  if(/\b(HA|DA|REF|WM|MWO)\b|APPLIANCE|HOME|REFRIG|FRIDGE|WASH|LAUNDRY|DRYER|MICRO|COOK|OVEN|DISH|VACUUM|KITCHEN|BESPOKE/.test(raw))return 'HA';
  return null}

function renderImp(){

function prepImport(rows){
  const H=rows[0].map(normH);const idx={};const used=new Set();
  Object.entries(COLS).forEach(([k,al])=>{let i=H.findIndex((h,j)=>!used.has(j)&&al.includes(h));if(i>=0){idx[k]=i;used.add(i)}});
  Object.entries(COLS).forEach(([k,al])=>{if(idx[k]!=null||['ts','bu','reported','status'].includes(k))return;const i=H.findIndex((h,j)=>!used.has(j)&&!(k==='complete'&&h.includes('INCOMPLETE'))&&al.some(a=>a.length>5&&h.includes(a)));if(i>=0){idx[k]=i;used.add(i)}});
  const statusMode=idx.status!=null;
  if(idx.ts==null)return toast('No TRADE SUPERVISOR column found');
  const fields=Object.keys(idx).filter(k=>!['month','ts','bu','region','status'].includes(k)&&!(statusMode&&['required','complete','fullDep'].includes(k)));if(!fields.length&&!statusMode)return toast('No KPI columns recognized — download the template');
  const P0=month(),defBU=$('iBU').value;const groups={};let bad=0,out=0;
  rows.slice(1).forEach(r=>{const name=(r[idx.ts]||'').trim();if(!name)return;const m=P0;
    if(idx.month!=null){const ok=rowInRange(r[idx.month],P0);if(ok===null){bad++;return}if(!ok){out++;return}}
    const bu=idx.bu!=null?(normBU(r[idx.bu])||defBU):defBU;const key=m+'|'+nameKey(name);
    const g=groups[key]=groups[key]||{m,name,region:idx.region!=null?(r[idx.region]||'').trim():'',vals:{}};
    if(statusMode){const k=statusKind(r[idx.status]);if(k){const P=f=>`bu.${bu}.${f}`;['required','complete','fullDep'].forEach(f=>{g.vals[P(f)]=g.vals[P(f)]||0});g.vals[P('required')]++;if(k!=='incomplete')g.vals[P(k)]++}}
    fields.forEach(f=>{const raw=String(r[idx[f]]??'').trim();if(!raw)return;const p=BU_KEYS.includes(f)?`bu.${bu}.${f}`:f;g.vals[p]=(g.vals[p]||0)+n(raw.replace(/,/g,''))})});
  const list=Object.values(groups).map(g=>({...g,t:findTs(g.name)}));
  pending={list,src:$('iSrc').value};
  const found=list.filter(x=>x.t).length;
  $('iPrev').innerHTML=`<div class="flag blue" style="margin-top:0">Detected: ${statusMode?'<b>STATUS per row</b> (Complete / Incomplete / Incomplete Full Deployment → counted per BU)'+(fields.length?', ':''):''}${fields.map(f=>COL_LABEL[f]).join(', ')}${idx.bu==null&&(statusMode||fields.some(f=>BU_KEYS.includes(f)))?` → BU <b>${defBU}</b>`:''}. ${list.length} TS into <b>${esc(monthLabel(P0))}</b>: <b>${found} matched</b>, ${list.length-found} unknown TS${out?`, ${out} row(s) outside the date range skipped`:''}${bad?`, ${bad} row(s) with unreadable date skipped`:''}.</div>

    <div class="row" style="margin-top:10px"><button class="btn pri" id="iApply">Apply import</button><button class="btn sm" id="iCancel">Cancel</button></div>`;
  $('iCancel').onclick=()=>{pending=null;$('iPrev').innerHTML=''};

async function fetchInventory(m){const u=S.sources.inventoryUrl;if(!u)throw new Error('No Inventory Tool URL');const q=u.includes('?')?'&':'?';
  let d=null,lite=false;
  try{const r=await fetch(u+q+'action=getKpiData&start='+encodeURIComponent(pStart(m))+'&end='+encodeURIComponent(pEnd(m))+'&t='+Date.now());const j=await r.json();if(j&&Array.isArray(j.requests)&&!j.error){d=j;lite=true}}catch(e){}
  if(!d){const r=await fetch(u+q+'action=getData&t='+Date.now());d=await r.json();if(!d||!Array.isArray(d.requests))throw new Error(d&&d.error?d.error:'Unexpected response')}
  d.tradeSupervisors=d.tradeSupervisors||[];d.posmMaster=d.posmMaster||[];d.lite=lite;return d}
function monthOf(v){if(!v)return '';const s=String(v);if(/^\d{4}-\d{2}/.test(s))return s.slice(0,7);const d=new Date(s);return isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
async function pullInventory(m,manual){
  if(!S.sources.inventoryUrl)return;const box=$('invRes');if(box)box.innerHTML='<div class="flag blue" style="margin-top:0">Pulling from Inventory Tool…</div>';

    const tsById={};d.tradeSupervisors.forEach(t=>tsById[String(t.id)]=t);
    const buByCode={};d.posmMaster.forEach(p=>buByCode[String(p.code)]=normBU(p.bu));
    const D=newDiag('inv',m);D.read=d.requests.length;const rawBu={};d.posmMaster.forEach(p=>rawBu[String(p.code)]=p.bu);
    d.requests.forEach(r=>{tally(D.status,r.status);if(String(r.status).toLowerCase()==='delivered')tally(D.months,monthOf(r.dateDelivered)||'(no date)')});
    if(!d.lite&&d.requests.length>=1000)D.note='Only the latest 1,000 requests were returned by getData — install the Inventory add-on to read all of them.';
    const del=d.requests.filter(r=>{if(String(r.status).toLowerCase()!=='delivered'){tally(D.skip,'status not Delivered');return false}if(!inPeriod(dateOf(r.dateDelivered),m)){tally(D.skip,dateOf(r.dateDelivered)?'delivered outside the date range':'no delivery date');return false}return true});
    const groups={};let noBU=0;
    del.forEach(r=>{const tsRec=tsById[String(r.ts)];const name=String(tsRec?tsRec.name:r.ts||'').trim();if(!name){tally(D.skip,'no Trade Supervisor');return}const bu=buByCode[String(r.posmCode)];
      if(!bu){noBU++;tally(D.skip,'BU not recognized');tally(D.badBU,rawBu[String(r.posmCode)]===undefined?'(POSM code not in master: '+r.posmCode+')':rawBu[String(r.posmCode)]);return}D.used++;
      const g=groups[nameKey(name)]=groups[nameKey(name)]||{m,name,region:tsRec?tsRec.region:'',vals:{}};const p=`bu.${bu}.delivered`;g.vals[p]=(g.vals[p]||0)+n(r.qty)});
    // TS with no deliveries in the range but active in Inventory → Delivered = 0 is NOT written (unknown vs zero), so we only fill who had deliveries
    const res=applyGroups(Object.values(groups),'Inventory Tool',{respectManual:true,addNew:true});
    const partial=!d.lite&&d.requests.length>=1000;
    const summary=`${del.length} delivered request line(s) → ${res.upd} TS updated${res.added?`, ${res.added} new TS added`:''}${res.kept?`, ${res.kept} manual value(s) kept`:''}${res.skip?`, ${res.skip} TS not in KPI list (${res.skipped.slice(0,3).map(esc).join(', ')}${res.skip>3?'…':''})`:''}${noBU?`, ${noBU} line(s) with unknown BU`:''}${partial?' · ⚠ only latest 1,000 requests read — install the add-on':''}`;
    S.sources.lastPull={month:m,at:new Date().toISOString(),summary};save();
    if(box)box.innerHTML=`<div class="flag ${res.skip||noBU||partial?'':'green'}" style="margin-top:0">Inventory Tool · ${esc(monthLabel(m))}: ${summary}.${res.skip?' Use <b>Sync TS list</b> to add missing TS.':''}</div>`;
    if(manual)toast('Pulled from Inventory Tool');renderDiag();if(view!=='imp')render();return res}
  catch(e){if(box)box.innerHTML=`<div class="flag red" style="margin-top:0">Pull failed: ${esc(e.message)}</div>`;if(manual)toast('Pull failed: '+e.message)}}

const CODE_GS=`/**
 * RMAS VISTA — TS POSM KPI Grading backend (Google Apps Script)
 * Paste into Extensions > Apps Script of a Google Sheet, then
 * Deploy > New deployment > Web app (Execute as: Me, Access: Anyone).
 */
const DATA_SHEET = 'KPI_DATA';   // tool storage (do not edit)
const VIEW_SHEET = 'GRADES';     // readable table for reports
const CHUNK = 40000;

function doGet(e) {
  try { return out_({ ok: true, data: load_() }); }
  catch (err) { return out_({ ok: false, error: String(err) }); }
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const body = JSON.parse(e.postData.contents);
    if (body.action === 'save') {
      // Merge with what other devices saved (newest edit wins per record / TS; deletions kept)
      const merged = mergeState(load_(), body.data);
      save_(merged);
      if (body.rows) writeView_(body.rows);
      return out_({ ok: true, savedAt: new Date().toISOString(), data: merged });
    }
    return out_({ ok: false, error: 'Unknown action' });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  } finally { lock.releaseLock(); }
}

function sheet_(name) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  return ss.getSheetByName(name) || ss.insertSheet(name);
}

function load_() {
  const sh = sheet_(DATA_SHEET);
  const n = sh.getLastRow();
  if (!n) return null;
  const txt = sh.getRange(1, 1, n, 1).getValues().map(r => String(r[0]).slice(1)).join('');
  return txt ? JSON.parse(txt) : null;
}

function save_(data) {
  const sh = sheet_(DATA_SHEET);
  const s = JSON.stringify(data);
  const rows = [];
  for (let i = 0; i < s.length; i += CHUNK) rows.push(['x' + s.slice(i, i + CHUNK)]); // 'x' prefix keeps cells as plain text
  sh.clear();
  if (rows.length) sh.getRange(1, 1, rows.length, 1).setValues(rows);
}

function writeView_(rows) {
  const sh = sheet_(VIEW_SHEET);
  sh.clear();
  if (!rows.length) return;
  const w = Math.max.apply(null, rows.map(r => r.length));
  const data = rows.map(r => { const x = r.slice(); while (x.length < w) x.push(''); return x; });
  sh.getRange(1, 1, data.length, w).setValues(data);
  sh.getRange(1, 1, 1, w).setFontWeight('bold').setBackground('#0e2733').setFontColor('#ffffff');
  sh.setFrozenRows(1);
}

${mergeState.toString()}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

     <div class="row" style="margin-bottom:10px"><label class="btn sm">Import TS list CSV (REGION, TRADE SUPERVISOR)<input type="file" id="sTsImp" accept=".csv" hidden></label></div>
     <div class="tbl-wrap" style="max-height:360px;overflow:auto"><table><thead><tr><th>Region</th><th>Trade Supervisor</th><th class="num">Ranges graded</th><th></th></tr></thead><tbody>
     ${[...S.ts].sort((a,b)=>a.region.localeCompare(b.region)||a.name.localeCompare(b.name)).map(t=>`<tr><td>${esc(t.region)}</td><td>${esc(t.name)}${(t.aliases||[]).length?`<div class="muted" style="font-size:11px">also: ${t.aliases.map(esc).join(', ')}</div>`:''}</td><td class="num">${Object.keys(S.records).filter(k=>k.endsWith('|'+t.id)).length}</td><td style="white-space:nowrap"><button class="btn sm" data-merge="${t.id}" title="Same person with a different spelling? Merge into another TS">Merge</button> <button class="btn sm danger" data-del="${t.id}">Delete</button></td></tr>`).join('')}</tbody></table></div></div>
   <div class="card"><h3>Data</h3>
     <div class="row"><button class="btn sm" id="sExpAll">Export all grades (CSV)</button><button class="btn sm" id="sBackup">Backup (JSON)</button><label class="btn sm">Restore (JSON)<input type="file" id="sRestore" accept=".json" hidden></label><button class="btn sm danger" id="sReset">Clear all TS &amp; grades</button></div>
     <p class="muted" style="font-size:12px;margin-top:12px">${sheetUrl?'Connected to Google Sheets — changes sync to all devices.':'Offline mode: data is saved in this browser only. Connect Google Sheets in <b>Import &amp; Sync</b> for cross-device sync.'}</p>
     <h3 style="margin-top:18px">How the score is computed</h3>
     <div style="font-size:12.5px">${KPIS.map((k,i)=>`<p style="margin:6px 0"><b>${i+1}. ${k.name} (${S.weights[k.key]}%)</b> — ${k.formula}</p>`).join('')}
     <p class="muted" style="margin-top:8px">Final = Σ(score × weight) − deductions. If a KPI has no data for the date range, its weight is redistributed over the KPIs that do. The watchlist flags TS declining 3 graded periods in a row, below 80% for 2 consecutive periods, rated Poor, or with a disputed grade.</p></div></div></div>`;
  const upd=()=>{const t=[...document.querySelectorAll('[data-w]')].reduce((a,i)=>a+n(i.value),0);$('sWTot').textContent='Total: '+t+'%';$('sWTot').style.color=t===100?'var(--good)':'var(--bad)'};
  document.querySelectorAll('[data-w]').forEach(i=>i.oninput=upd);upd();
  $('sWSave').onclick=()=>{const w={};document.querySelectorAll('[data-w]').forEach(i=>w[i.dataset.w]=n(i.value));if(Object.values(w).reduce((a,b)=>a+b,0)!==100)return toast('Weights must total 100%');S.weights=w;save();toast('Weights saved');renderSet()};
  $('sWReset').onclick=()=>{S.weights={...DEFAULT_WEIGHTS};save();renderSet();toast('Default weights restored')};
  $('sGSave').onclick=()=>{const g2=gs.map(g=>({...g}));document.querySelectorAll('[data-g]').forEach(i=>g2[+i.dataset.g].min=n(i.value));
    for(let i=1;i<g2.length;i++)if(g2[i].min>=g2[i-1].min)return toast('Each grade needs a lower minimum than the one above');S.grades=g2;save();toast('Grading scale saved');renderSet()};
  $('sGReset').onclick=()=>{S.grades=DEFAULT_GRADES.map(g=>({...g}));save();renderSet();toast('Default scale restored')};
  const readDed=()=>S.deductions.map(d=>({id:d.id,label:(document.querySelector(`[data-dl="${d.id}"]`)?.value??d.label).trim(),pts:n(document.querySelector(`[data-dp="${d.id}"]`)?.value??d.pts)}));
  $('sDAdd').onclick=()=>{S.deductions=readDed();S.deductions.push({id:uid('d'),label:'New deduction',pts:1});renderSet()};
  $('sDSave').onclick=()=>{S.deductions=readDed().filter(d=>d.label);save();toast('Deduction list saved');renderSet()};
  document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{S.deductions=readDed().filter(d=>d.id!==b.dataset.dx);renderSet();toast('Removed — click Save list to keep')});
  $('sPSave').onclick=()=>{const a=$('sP1').value,b=$('sP2').value;if(a.length<4)return toast('At least 4 characters');if(a!==b)return toast('Passwords do not match');S.adminPass=a;save();$('sP1').value=$('sP2').value='';toast('Admin password changed')};
  $('sTsAdd').onclick=()=>{const name=$('sTsName').value.trim(),region=$('sTsRegion').value.trim();if(!name||!region)return toast('Enter name and region');
    if(findTs(name))return toast('TS already exists');S.ts.push({id:uid(),name,region});save();fillRegions();renderSet();toast('Trade Supervisor added')};
  document.querySelectorAll('[data-merge]').forEach(b=>b.onclick=()=>{const src=S.ts.find(x=>x.id===b.dataset.merge);
    modal(`<h3 style="margin-top:0">Merge “${esc(src.name)}”</h3><p class="muted" style="font-size:12.5px">Use when the same Trade Supervisor appears twice with different spellings. Grades move to the TS you pick, and this spelling is remembered so future pulls match automatically.</p>
      <select id="mTo" style="width:100%">${[...S.ts].filter(x=>x.id!==src.id).sort((a,c)=>a.name.localeCompare(c.name)).map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.region)}</option>`).join('')}</select>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sm" onclick="closeModal()">Cancel</button><button class="btn sm pri" id="mOk">Merge</button></div>`);
    $('mOk').onclick=()=>{const to=S.ts.find(x=>x.id===$('mTo').value);if(!to)return;let moved=0;
      Object.keys(S.records).forEach(k=>{const [m,id]=k.split('|');if(id!==src.id)return;const kt=m+'|'+to.id;if(!S.records[kt]){S.records[kt]=S.records[k];moved++}delete S.records[k]});
      to.aliases=[...new Set([...(to.aliases||[]),src.name,...(src.aliases||[])])];if((!to.region||to.region==='Unassigned')&&src.region)to.region=src.region;
      S.ts=S.ts.filter(x=>x.id!==src.id);closeModal();save();fillRegions();renderSet();toast(`Merged into ${to.name} (${moved} grade(s) moved)`)}});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const t=S.ts.find(x=>x.id===b.dataset.del);modalConfirm(`Delete ${t.name} and all their grades?`,()=>{
    S.ts=S.ts.filter(x=>x.id!==t.id);Object.keys(S.records).forEach(k=>{if(k.endsWith('|'+t.id))delete S.records[k]});save();fillRegions();renderSet();toast('Deleted')})});
  $('sTsImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=parseCsv(await f.text());e.target.value='';const h=rows[0].map(normH);
    const ri=h.findIndex(x=>x.includes('REGION')),ti=h.findIndex(x=>x.includes('SUPERVISOR')||x==='TS');if(ri<0||ti<0)return toast('CSV needs REGION and TRADE SUPERVISOR columns');
    let add=0;rows.slice(1).forEach(r=>{const name=(r[ti]||'').trim(),region=(r[ri]||'').trim();if(name&&region&&!findTs(name)){S.ts.push({id:uid(),name,region});add++}});
    save();fillRegions();renderSet();toast(add+' Trade Supervisor(s) imported')};
  $('sExpAll').onclick=()=>exportCsv();
  $('sBackup').onclick=()=>download('TS_POSM_KPI_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1),'application/json');
  $('sRestore').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const x=JSON.parse(await f.text());if(!x.ts||!x.records)throw 0;S=normalizeState(x);save();fillRegions();render();toast('Backup restored')}catch(_){toast('Invalid backup file')}};
  $('sReset').onclick=()=>modalConfirm('Delete ALL Trade Supervisors and grades? Settings and connected tools are kept. Download a Backup first if unsure.',()=>{S.ts=[];S.records={};save();fillRegions();render();toast('All TS & grades cleared')});
}
function exportCsv(p){const rows=flatRows();const out=[rows[0],...rows.slice(1).filter(r=>!p||(r[0]===pStart(p)&&r[1]===pEnd(p)))];download(`TS_POSM_KPI_${p?pStart(p)+'_to_'+pEnd(p):'ALL'}.csv`,toCsv(out),'text/csv')}

/* =====================================================================
   BOOT
   ===================================================================== */
applyRole();
(async()=>{if(sheetUrl)await pullRemote(false);if(!isAdmin())return;const src=S.sources;
  if(src.inventoryUrl)await syncTsFromInventory(false);
  if(src.deploymentUrl&&src.depAutoPull&&periodHasToday(month()))await pullDeployments(month(),false);
  if(src.inventoryUrl&&src.autoPull)await pullInventory(month(),false);render()})();
</script>
</body>
</html>
